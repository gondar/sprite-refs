<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cutout Animation Lab</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1d1b18;--mute:#6b665d;--line:#e2ddd3;--acc:#c2410c;--stage:#efe9dd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181715;--panel:#22201d;--ink:#eeeae2;--mute:#a39d92;--line:#37332d;--acc:#fb923c;--stage:#2b2824}}
:root[data-theme="dark"]{--bg:#181715;--panel:#22201d;--ink:#eeeae2;--mute:#a39d92;--line:#37332d;--acc:#fb923c;--stage:#2b2824}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:34px 0 8px}p{margin:6px 0;max-width:75ch}.mute{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h3{font-size:15px;margin:0 0 2px}.card .sub{font-size:13px;color:var(--mute);margin-bottom:8px}
canvas{width:100%;aspect-ratio:1;background:var(--stage);border-radius:8px;display:block}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
button{font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
label{font-size:13px;color:var(--mute);margin-right:10px;white-space:nowrap}
.verdict{font-size:13px;margin-top:6px}.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--stage);margin-right:4px}
table{border-collapse:collapse;font-size:14px;width:100%;margin:8px 0}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.wide{overflow-x:auto}img.sheet{width:100%;border-radius:8px;background:var(--stage)}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sheets.mini{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.sheets figure{margin:0}.sheets figcaption{font-size:13px;color:var(--mute)}
</style></head><body><main>

<script>/* Cut-out puppet player: draws a rig (pieces + pivots) in any pose on a 2D canvas. No dependencies.
   A rig: { bones: [{name, img, bbox:[x,y,w,h], pivot:[x,y], parent, at:[x,y], z, flip, scale, rot, hidden}] }
   All coordinates are SHEET pixels: `pivot` is the joint on this piece, `at` is where that joint sits on the
   parent piece. A pose: { boneName: {r (deg), x, y, sx, sy, a (alpha), show} } — everything optional. */
(function (G) {
  function prepare(rig, images) {
    const by = {};
    rig.bones.forEach(b => { by[b.name] = b; b.canvas = images[b.name]; });
    rig.by = by;
    rig.order = rig.bones.slice().sort((a, b) => (a.z || 0) - (b.z || 0));
    return rig;
  }
  function matFor(rig, name, pose, cache) {
    if (cache[name]) return cache[name];
    const b = rig.by[name], p = pose[name] || {};
    let m;
    if (b.parent) {
      const pb = rig.by[b.parent];
      m = matFor(rig, b.parent, pose, cache).translate(b.at[0] - pb.pivot[0], b.at[1] - pb.pivot[1]);
    } else m = new DOMMatrix();
    m = m.translate(p.x || 0, p.y || 0).rotate(((b.rot || 0) + (p.r || 0)))
      .scale((p.sx ?? 1) * (b.scale || 1), (p.sy ?? 1) * (b.scale || 1));
    return (cache[name] = m);
  }
  function draw(ctx, rig, pose, x, y, k, opts) {
    opts = opts || {};
    const cache = {};
    ctx.save(); ctx.translate(x, y); ctx.scale(k * (opts.face || 1), k);
    const base = ctx.getTransform();
    for (const b of rig.order) {
      const p = pose[b.name] || {};
      const show = p.show ?? !b.hidden;
      if (!show || (p.a ?? 1) <= 0) continue;
      const m = matFor(rig, b.name, pose, cache);
      ctx.setTransform(base.multiply(m));
      ctx.globalAlpha = p.a ?? 1;
      const dx = b.bbox[0] - b.pivot[0], dy = b.bbox[1] - b.pivot[1];
      if (b.flip) { ctx.scale(-1, 1); ctx.drawImage(b.canvas, dx, dy, b.bbox[2], b.bbox[3]); }
      else ctx.drawImage(b.canvas, dx, dy, b.bbox[2], b.bbox[3]);
      if (opts.pivots) { ctx.fillStyle = "#e33"; ctx.beginPath(); ctx.arc(0, 0, 6 / k, 0, 7); ctx.fill(); }
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // tiny helpers for writing animations
  const S = Math.sin, TAU = Math.PI * 2;
  const wave = (t, hz, amp, ph) => amp * S(TAU * (hz * t + (ph || 0)));
  const ease = u => u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u);
  // a lagging follower: damped pendulum response to a driver, closed form good enough for loops
  const lag = (t, hz, amp, delay) => amp * S(TAU * hz * (t - delay));
  G.Cutout = { prepare, draw, wave, ease, lag, TAU };
})(window);
</script>

      else sy = 1 - 0.14 * Math.sin(Math.PI * (u - 0.78) / 0.22);

// face swaps: each rig maps the states it has onto its spare pieces
function face(r, state) {
  const has = n => r.by[n], o = {};
  if (has("blink") || has("sing")) {  // C2 rigs: swaps cut from edits of the reference picture
    if (state === "closed" && has("blink")) o.blink = { show: true };
    if ((state === "happy" || state === "sing") && has("sing")) o.sing = { show: true };
    return o;
  }
  if (state === "closed") { if (has("eyesclosed")) o.eyesclosed = { show: true }; if (has("facesleep")) o.facesleep = { show: true }; if (has("eyeclosed")) o.eyeclosed = { show: true }; }
  if (state === "happy") { if (has("happyface")) o.happyface = { show: true }; else if (has("facesleep")) o.facesleep = { show: true }; }
  if (state === "sing") { if (has("happyface")) o.happyface = { show: true }; if (has("beakopen")) o.beakopen = { show: true }; if (has("mouthopen")) o.mouthopen = { show: true }; }
  return o;
}

/* ---------------- one-image mesh warp (no parts at all) ---------------- */
function meshDraw(ctx, img, x, y, k, deform, t) {
  const N = 14, w = img.width, h = img.height, P = [];
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) { const u = i / N, v = j / N; const d = deform(u, v, t); P.push([u * w + d[0] * w, v * h + d[1] * h]); }
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.translate(-w / 2, -h);
  const tri = (a, b, c) => { const s = [[a % (N + 1) / N * w, Math.floor(a / (N + 1)) / N * h], [b % (N + 1) / N * w, Math.floor(b / (N + 1)) / N * h], [c % (N + 1) / N * w, Math.floor(c / (N + 1)) / N * h]];
    const d = [P[a], P[b], P[c]];
    // grow the destination triangle by ~0.7px around its centroid to hide hairline seams
    const cx = (d[0][0] + d[1][0] + d[2][0]) / 3, cy = (d[0][1] + d[1][1] + d[2][1]) / 3;
    const g = p => { const dx = p[0] - cx, dy = p[1] - cy, L = Math.hypot(dx, dy) || 1; return [p[0] + dx / L * 1.2 / k, p[1] + dy / L * 1.2 / k]; };
    const D = d.map(g);
    ctx.save(); ctx.beginPath(); ctx.moveTo(D[0][0], D[0][1]); ctx.lineTo(D[1][0], D[1][1]); ctx.lineTo(D[2][0], D[2][1]); ctx.closePath(); ctx.clip();
    const [x0, y0] = s[0], [x1, y1] = s[1], [x2, y2] = s[2], [u0, v0] = d[0], [u1, v1] = d[1], [u2, v2] = d[2];
    const den = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
    const a11 = ((u1 - u0) * (y2 - y0) - (u2 - u0) * (y1 - y0)) / den, a12 = ((u2 - u0) * (x1 - x0) - (u1 - u0) * (x2 - x0)) / den;
    const a21 = ((v1 - v0) * (y2 - y0) - (v2 - v0) * (y1 - y0)) / den, a22 = ((v2 - v0) * (x1 - x0) - (v1 - v0) * (x2 - x0)) / den;
    ctx.transform(a11, a21, a12, a22, u0 - a11 * x0 - a12 * y0, v0 - a21 * x0 - a22 * y0);
    ctx.drawImage(img, 0, 0); ctx.restore(); };
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const a = j * (N + 1) + i; tri(a, a + 1, a + N + 1); tri(a + 1, a + N + 2, a + N + 1); }
  ctx.restore();
}
const up = v => 1 - v; // 0 at the feet, 1 at the top
const MESH = {
  idle: { len: 4, f: (u, v, t) => { const h = up(v), br = Math.sin(TAU * t / 2);
    return [0.025 * h * h * Math.sin(TAU * t / 4) - (u - 0.5) * 0.012 * br * h, -0.02 * br * h]; } },
  sway: { len: 2, f: (u, v, t) => { const h = up(v); return [0.08 * h * h * Math.sin(TAU * t / 2), 0.01 * h * Math.abs(Math.sin(TAU * t / 2))]; } },
  squash: { len: 1.2, f: (u, v, t) => { const s = Math.sin(TAU * t / 1.2); const h = up(v); return [(u - 0.5) * 0.08 * s * (1 - h * 0.5), 0.07 * s * h - (s > 0 ? 0 : 0)]; } },
  hop: { len: 1.2, f: (u, v, t) => { const q = (t % 1.2) / 1.2, h = up(v); let lift = 0, sq = 0;
    if (q < 0.2) sq = Math.sin(Math.PI * q / 0.2) * 0.08; else if (q < 0.8) { const w = (q - 0.2) / 0.6; lift = 0.18 * Math.sin(Math.PI * w); sq = -0.04 * Math.sin(Math.PI * w); } else sq = Math.sin(Math.PI * (q - 0.8) / 0.2) * 0.1;
    return [(u - 0.5) * sq, -lift + sq * h]; } },
};

const app = document.getElementById("app");
const H = (tag, attrs, ...kids) => { const e = document.createElement(tag); Object.assign(e, attrs || {}); kids.flat().forEach(k => e.append(k)); return e; };
function loadImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }

const players = [];
function rigCard(rig, imgs) {
  C.prepare(rig, imgs);
  const anims = ANIM[rig.kind];
  const cv = H("canvas", { width: 640, height: 640 });
  const st = { anim: Object.keys(anims)[0], pivots: QS.has("debug"), small: false };
  const btns = H("div", { className: "btns" }, Object.keys(anims).map(n => { const b = H("button", { textContent: n, className: n === st.anim ? "on" : "" }); b.onclick = () => { st.anim = n; [...btns.children].forEach(c => c.classList.toggle("on", c === b)); }; return b; }));
  const opt = H("div", {}, H("label", {}, H("input", { type: "checkbox", checked: st.pivots, onchange: e => st.pivots = e.target.checked }), " pivots"),
    H("label", {}, H("input", { type: "checkbox", onchange: e => st.small = e.target.checked }), " game size (96 px)"));
  const card = H("div", { className: "card" }, H("h3", { textContent: rig.label }), H("div", { className: "sub", textContent: `${rig.bones.length} pieces · ${(rig.bytes / 1024).toFixed(0)} KB of art (webp, half-res) · ${rig.cost}` }), cv, btns, opt, H("div", { className: "verdict", innerHTML: rig.verdict || "" }));
  players.push(t => {
    const ctx = cv.getContext("2d"); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 640, 640);
    const A = anims[st.anim], tt = t % A.len, pose = A.f(tt, rig);
    if (st.small) { ctx.imageSmoothingQuality = "high"; const k = 96 / (rig.height || 700); C.draw(ctx, rig, pose, 320, 320 + 30, k * 1, { pivots: false }); }
    else C.draw(ctx, rig, pose, 320, rig.y0 || 360, rig.k || 0.62, { pivots: st.pivots });
  });
  return card;
}
function meshCard(title, sub, img, verdict) {
  const cv = H("canvas", { width: 640, height: 640 });
  const st = { anim: "idle", grid: false };
  const btns = H("div", { className: "btns" }, Object.keys(MESH).map(n => { const b = H("button", { textContent: n, className: n === st.anim ? "on" : "" }); b.onclick = () => { st.anim = n; [...btns.children].forEach(c => c.classList.toggle("on", c === b)); }; return b; }));
  players.push(t => { const ctx = cv.getContext("2d"); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 640, 640);
    const A = MESH[st.anim]; meshDraw(ctx, img, 320, 590, 470 / Math.max(img.width, img.height), A.f, t % A.len); });
  return H("div", { className: "card" }, H("h3", { textContent: title }), H("div", { className: "sub", textContent: sub }), cv, btns, H("div", { className: "verdict", innerHTML: verdict }));
}
function stripCard(title, sub, img, frames, fps, verdict) {
  const cv = H("canvas", { width: 640, height: 640 });
  const fw = img.width / frames, fh = img.height;
  players.push(t => { const ctx = cv.getContext("2d"); ctx.clearRect(0, 0, 640, 640); const i = Math.floor(t * fps) % frames; const k = 560 / Math.max(fw, fh);
    ctx.drawImage(img, i * fw, 0, fw, fh, 320 - fw * k / 2, 600 - fh * k, fw * k, fh * k); });
  return H("div", { className: "card" }, H("h3", { textContent: title }), H("div", { className: "sub", textContent: sub }), cv, H("div", { className: "verdict", innerHTML: verdict }));
}

(async () => {
  for (const r of RIGS) { const im = {}; for (const b of r.bones) im[b.name] = await loadImg(b.src); r._imgs = im; }
  const X = {}; for (const k in EXTRA) X[k] = await loadImg(EXTRA[k]);
  window.__build(app, { rigCard, meshCard, stripCard, H, X });
  const t0 = performance.now();
  window.__redraw = () => players.forEach(p => p(FREEZE ?? 0));
  const loop = now => { const t = FREEZE ?? (now - t0) / 1000; players.forEach(p => p(t)); if (FREEZE == null) requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  document.body.dataset.ready = "1";
})();
</script>
<script>window.__build = (app, K) => {
  const { H, X } = K;
  const P = html => H("p", { innerHTML: html });
  const sec = (title, ...kids) => H("section", {}, H("h2", { textContent: title }), ...kids);
  const byName = n => RIGS.find(r => r.name === n);

  app.append(
    H("h1", { textContent: "Cutout animation — experiments C1 and C2" }),
    P('<span class="mute">2026-10-13 · Sówka (owl) and Leoś (fox) · Nano Banana / Nano Banana Pro through APIYI · C1 $0.23, C2 $0.15 · total so far ≈ $3.82 of $10</span>'),
    P("<b>C2 fixes the quality problem of C1.</b> In C1 the model drew every piece separately, so the pieces never matched: every piece had its own outline, the hat floated, a stray spot showed, and edges had a light fringe. In C2 the finished reference picture is taken apart instead: a colour-coded parts map (an edit of the same picture, lines up to 1 px), edits that remove a part and paint what was hidden under it, and edits for blink and singing. The rest pose is the original picture; motion reveals painted fur, not holes; edges are choked so there is no fringe on dark backgrounds. Cutting, layering and pivots are automatic (<code>decompose.py</code>)."),
  );
  const g0 = H("div", { className: "grid" });
  g0.append(K.rigCard(byName("owl-decomp"), byName("owl-decomp")._imgs));
  g0.append(H("div", { className: "card" }, H("h3", { textContent: "How C2 was made — 6 edits, $0.147" }),
    H("div", { className: "sheets mini" }, ...[["c2seg", "parts map"], ["c2base", "hat removed, head painted"], ["c2body", "body alone, wing removed (2 edits)"], ["c2blink", "blink"], ["c2sing", "sing"]]
      .map(([k, c]) => H("figure", {}, H("img", { className: "sheet", src: EXTRA[k], alt: c }), H("figcaption", { textContent: c })))),
    P("Misses on the way: the first \"remove the wing\" instructions were ignored twice (the body edit also came back zoomed — registered back automatically, overlap 0.95); a third edit on the body alone did it. Still rigid: the wing is one piece, so when it flaps its root stays on the body.")));
  app.append(sec("C2 — the reference picture taken apart into layers", g0));

  const g1 = H("div", { className: "grid" });
  ["owl-pro", "owl-flash", "fox-grid"].forEach(n => g1.append(K.rigCard(byName(n), byName(n)._imgs)));
  app.append(sec("C1 (before) — pieces drawn separately on one sheet",
    P("Click the actions. <b>pivots</b> shows the joints; <b>game size</b> draws it as small as in the game. Blinks, the happy face, the open beak and the fox's open mouth are spare pieces swapped in on top of the face."), g1));

  const g2 = H("div", { className: "grid" });
  g2.append(K.meshCard("Owl — one image, mesh warp", "the existing reference image only · $0 extra · 0 pieces", X.owlWhole,
    "Breathing, sway, squash and a hop by bending a 14×14 grid laid over the whole picture. Nothing to cut, nothing to rig. Good for idles and reactions; it cannot move a wing or a leg on its own, and a strong bend smears the detail."));
  g2.append(K.meshCard("Fox — one image, mesh warp", "the existing reference image only · $0 extra · 0 pieces", X.foxWhole,
    "Same trick on the fox: the tail and the hat move with the body, so it reads as the whole picture wobbling. Fine as a stand-in conductor idle, not for walking."));
  app.append(sec("Option B — no pieces at all: warp the single picture", P("The cheapest trick in the set, shown for comparison: it uses the character reference we already have."), g2));

  const g3 = H("div", { className: "grid" });
  g3.append(K.stripCard("Fox — H3 video idle (shipped in the game)", "24 frames · 117 KB · $0.12 clip", X.foxVideo, 24, 5.7,
    "The baseline: real fur and body motion, the head turns in 3D. One action per strip, and each action is a paid clip plus keying and loop work."));
  g3.append(K.stripCard("Owl — H3 video idle", "24 frames · 119 KB webp · $0.12 clip", X.owlVideo, 24, 5.7,
    "Softer and more alive than any puppet above, but it is only this one action."));
  app.append(sec("Baseline — the video route from the earlier experiments", g3));

  app.append(sec("The sheets",
    P("Same prompt for each character, one reference image (the character design). <b>Exploded view</b> = the character taken apart with gaps, every piece near its natural place; <b>grid</b> = asset-sheet layout with a named list."),
    H("div", { className: "sheets" },
      ...[["owlProSheet", "Owl · exploded · Pro $0.09 — drew joint tabs by itself"], ["owlFlashSheet", "Owl · exploded · Nano Banana $0.0245"],
        ["foxGridSheet", "Fox · grid · Nano Banana $0.0245 — used"], ["foxProSheet", "Fox · exploded · Pro $0.09 — not rigged: arms bent, head with open mouth, no anatomical layout"]]
        .map(([k, c]) => H("figure", {}, H("img", { className: "sheet", src: EXTRA[k], alt: c }), H("figcaption", { textContent: c })))),
    P('<span class="mute">A fifth job (fox exploded on Nano Banana) failed with HTTP 502 at 30 s and was logged at $0; not retried.</span>')));

  app.append(sec("What I learned",
    H("div", { className: "wide" }, H("table", { innerHTML: `
<tr><th>Question</th><th>Answer</th></tr>
<tr><td>Can Nano Banana draw a character as separate pieces?</td><td>Yes, first try, on both models, in the character's own style and colours. The prompt line that matters: <i>"extend each piece with a plain rounded tab past the joint, so pieces can rotate without showing a hole"</i> — both models drew the hidden overlap.</td></tr>
<tr><td>Exploded view or grid?</td><td>Exploded view for round characters (scale and placement come for free; the rest pose is nearly the layout itself). Grid for the fox also held scale. Pro ignored the exploded layout for the fox.</td></tr>
<tr><td>Flash or Pro?</td><td>Flash is enough. Pro's owl is a little cleaner and added joint tabs on its own; not worth 3.7× for this.</td></tr>
<tr><td>Body plan</td><td>Owl (head, body, 2 wings, 2 feet, hat, pompom): excellent — most of its life is head tilt, wing flap, squash, blink. Fox (biped): walk reads well at game size; up close, legs are rigid blobs with no knees and the body cannot turn.</td></tr>
<tr><td>Face swaps</td><td>Owl spares came as clean face pieces (drop-in). Fox spares came as square patches of fur — feathered into ovals they work at game size. Ask for "a whole head with eyes closed" instead of a patch.</td></tr>
<tr><td>Draw order</td><td>Fixed per piece. The fox's near arm cannot wave without covering his face, so the wave uses the far arm, raised forward. A rig for a skill needs per-action layer order (or both arms drawn twice).</td></tr>
<tr><td>Work per character</td><td>Cutting is automatic (<code>pieces.py</code>). Rigging was by eye: ~2 points per piece, 2–3 tuning passes per character. That is the step to automate in a skill.</td></tr>
<tr><td>Size</td><td>All actions: 43–48 KB of pieces at half resolution. Video idle alone: 117 KB.</td></tr>`
    }))));

  app.append(sec("Other animation tricks worth considering",
    H("div", { className: "wide" }, H("table", { innerHTML: `
<tr><th>Trick</th><th>What it is</th><th>Cost</th><th>Good for</th></tr>
<tr><td><b>Mesh warp of one image</b> (shown above)</td><td>Bend a grid over the finished picture</td><td>$0</td><td>Idles, reactions, "alive" props and mascots — the default for anything that only needs to breathe</td></tr>
<tr><td><b>Rig → H3 mannequin</b></td><td>Render the puppet's motion to a short clip and feed it to H3 as the reference video, with the character image. The cutout sets exact timing and poses; H3 adds the life (fur, squash, turning)</td><td>$0.12 / clip</td><td>Fixing "run reads as walk" and timing drift in the video route; each character gets a mannequin of its own shape</td></tr>
<tr><td><b>Swap overlays on video</b></td><td>Keep the video sprite, add blink / mouth pieces on top from a parts sheet</td><td>$0.0245</td><td>Singing or talking characters without a clip per mouth shape</td></tr>
<tr><td><b>Frame interpolation</b></td><td>Generate 4–8 keyframes in one image, fill the in-betweens with an interpolation model (RIFE / FILM)</td><td>image + local compute</td><td>Smoothing drawn cycles (the 8-frame image route) — not tested here, needs a model we do not have in this sandbox</td></tr>
<tr><td><b>Procedural secondary motion</b></td><td>Springs on tails, ears, hats, pompoms driven by the body's motion (the pompom here lags the head)</td><td>$0</td><td>Adding life to any route, including video sprites with a separate tail piece</td></tr>
<tr><td><b>Bake to strips</b></td><td>Render the puppet to frames once</td><td>$0</td><td>Engines with no puppet runtime, pixel-art downscaling, or mixing with video strips</td></tr>`
    }))),
    P("<b>Recommendation.</b> If you want the skill: build it around the owl result — exploded-view parts sheet on Nano Banana → <code>pieces.py</code> → rig JSON with pivots → a small player (<code>cutout.js</code>, 2 KB) with procedural actions. The step to make reliable is rigging: ask the model for joint tabs in a marker colour (Pro drew them unasked) and detect them, so pivots come out automatically. Worth one more cheap round ($0.05–0.10) to test that before writing the skill."));
};
</script>
