<title>Paciorki światła</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Kino nocą: film na środku, pod nim cztery sznury paciorków do przeskakiwania między tajemnicami */
:root{
  --bg:#0f1120; --panel:#181b2f; --fg:#eceae2; --muted:#9aa0bb; --line:#2a2f4d;
  --pR:#cfe6c4; --pS:#3dbfb0; --pB:#c8475c; --pC:#f6c35b; --gold:#f6c35b;
  --display:"Uncial Antiqua", Georgia, serif; --body:"Alegreya Sans", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,40px);margin:0;letter-spacing:.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold)}
.film{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
video{width:100%;height:100%;display:block;background:#000}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.parts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.parts{grid-template-columns:1fr}}
.part{display:grid;gap:6px;min-width:0}
.part h2{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:700}
.my{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--fg);font:inherit;text-align:left;padding:5px 6px;border-radius:6px;cursor:pointer;min-width:0}
.my:hover,.my:focus-visible{background:var(--panel);outline:none}
.my:focus-visible{box-shadow:0 0 0 2px var(--c)}
.my i{flex:0 0 12px;height:12px;border-radius:50%;border:2px solid var(--c)}
.my.on i{background:var(--c);box-shadow:0 0 10px var(--c)}
.my span{min-width:0;overflow-wrap:anywhere}
.my.on span{color:var(--c)}
</style>

<div class="wrap">
  <h1>Paciorki <em>światła</em></h1>
  <div class="film">
    <video id="v" controls playsinline preload="metadata" poster=""></video>
    <div class="empty" id="empty" hidden>Film nie wczytał się. Odśwież stronę.</div>
  </div>
  <div class="parts" id="parts"></div>
</div>

<script>
const SRC="/_blob/61ce00c49d7225e1676b0344bcba399a";
const BAR=2.0434,INTRO=0.859+4*BAR,M=5*BAR;
const P=[["Radosne","--pR",["Zwiastowanie","Nawiedzenie","Narodzenie Pana Jezusa","Ofiarowanie w świątyni","Odnalezienie w świątyni"]],
 ["Światła","--pS",["Chrzest w Jordanie","Objawienie w Kanie","Głoszenie Królestwa","Przemienienie na Taborze","Ustanowienie Eucharystii"]],
 ["Bolesne","--pB",["Modlitwa w Ogrójcu","Biczowanie","Cierniem ukoronowanie","Droga krzyżowa","Ukrzyżowanie"]],
 ["Chwalebne","--pC",["Zmartwychwstanie","Wniebowstąpienie","Zesłanie Ducha Świętego","Wniebowzięcie Maryi","Ukoronowanie Maryi"]]];
const v=document.getElementById("v"),box=document.getElementById("parts");
box.innerHTML=P.map((p,pi)=>`<div class="part" style="--c:var(${p[1]})"><h2>Tajemnice ${p[0]}</h2>${p[2].map((m,i)=>`<button class="my" type="button" data-n="${pi*5+i}"><i></i><span>${i+1}. ${m}</span></button>`).join("")}</div>`).join("");
const btns=[...box.querySelectorAll(".my")];
box.addEventListener("click",e=>{const b=e.target.closest(".my");if(!b)return;v.currentTime=INTRO+(+b.dataset.n)*M+.4;v.play().catch(()=>{})});
v.addEventListener("timeupdate",()=>{const n=Math.floor((v.currentTime-INTRO)/M);btns.forEach((b,k)=>b.classList.toggle("on",k===n))});
v.addEventListener("error",()=>{document.getElementById("empty").hidden=false});
v.src=SRC;
</script>
