interface:
  display_name: "Generate Game GIFs"
  short_description: "Make, check and cut native animated GIFs into game spritesheets"
  default_prompt: "Use $generate-game-gifs to generate an 8-frame looping idle animation of my character on a flat key colour, validate it, and export a keyed WebP spritesheet with a manifest."
policy:
  allow_implicit_invocation: true
